# -----------------------------------------------------------------------------
# 版本保留策略 — 控制每個套件保留多少個主要版本
# -----------------------------------------------------------------------------
retention:
  # 每個套件保留的最大主要版本數量
  # 例如設為 5，則保留最新的 5 個 major version 下的所有版本
  # 較舊的 major version 會被清理
  # 可用範圍: 正整數 (建議 1-10)
  # 預設值: 5
  max_major_versions: 5

# -----------------------------------------------------------------------------
# 下載器設定 — 控制 Downloader CLI 的下載行為
# -----------------------------------------------------------------------------
downloader:
  # 同時下載的最大並行數量
  # 可用範圍: 正整數 (建議 1-32，視網路頻寬與系統資源調整)
  # 預設值: 16
  max_concurrency: 16

  # 單一檔案的下載逾時時間 (秒)
  # 可用範圍: 正整數 (建議 60-600)
  # 預設值: 300
  download_timeout_seconds: 300

  # 下載失敗時的重試次數
  # 可用範圍: 正整數 (建議 1-5)
  # 預設值: 3
  retry_count: 3

  # HTTP 請求的 User-Agent 標頭
  # 預設值: "FerryWinget/1.0"
  user_agent: "FerryWinget/1.0"

  # 套件列舉結果的本地快取有效期 (分鐘)
  # 快取檔案儲存於 {storage.root_path}/.cache/package-list-cache.json
  # 設為 0 可停用快取
  # 預設值: 30
  cache_ttl_minutes: 30

# -----------------------------------------------------------------------------
# Server 設定 — 控制內網 winget REST source server (ASP.NET Core)
# -----------------------------------------------------------------------------
server:
  # HTTP 監聽埠號
  # 可用範圍: 1-65535 (建議使用 1024 以上的非特權埠)
  # 預設值: 8080
  port: 8080

  # winget source 識別名稱 (顯示在 winget source list 中)
  # 預設值: "FerryWinget"
  source_identifier: "FerryWinget"

  # 支援的 winget REST API 版本清單
  # Windows 11 / Server 2022+ 用戶端會根據此清單協商 API 版本
  # 可用值: "1.4.0", "1.7.0", "1.9.0"
  # 預設值: ["1.4.0", "1.7.0", "1.9.0"]
  supported_api_versions:
    - "1.4.0"
    - "1.7.0"
    - "1.9.0"

# -----------------------------------------------------------------------------
# Azure Firewall 設定 — 自動部署 Firewall Policy 規則 (允許 installer 下載 FQDN)
# 由 Downloader 搭配 --dry-run 使用，透過 az CLI 部署
# -----------------------------------------------------------------------------
firewall:
  # 是否啟用 Azure Firewall Policy 自動部署
  # 可用值: true / false
  # 預設值: false
  enabled: true

  # Azure Firewall Policy 所在的資源群組名稱
  resource_group: "rg-firewall"

  # Azure Firewall Policy 名稱
  policy_name: "fw-policy-winget"

  # Rule Collection Group 名稱
  # 預設值: "rcg-winget-mirror"
  rule_collection_group_name: "rcg-winget-mirror"

  # TLS Inspection Rule Collection 名稱 (用於 HTTPS 流量)
  # 預設值: "rc-winget-tls"
  tls_rule_collection_name: "rc-winget-tls"

  # FQDN-only Rule Collection 名稱 (用於不需 TLS inspection 的流量)
  # 預設值: "rc-winget-fqdn"
  fqdn_rule_collection_name: "rc-winget-fqdn"

  # TLS Rule Collection 優先權 (數字越小優先權越高)
  # 可用範圍: 100-65000
  # 預設值: 500
  tls_rule_collection_priority: 500

  # FQDN Rule Collection 優先權
  # 可用範圍: 100-65000 (須與 tls_rule_collection_priority 不同)
  # 預設值: 501
  fqdn_rule_collection_priority: 501

  # 允許通過防火牆的來源 IP 位址/CIDR 清單
  # 範例:
  #   - "10.0.0.0/8"         # 整個 10.x.x.x 私有網段
  #   - "172.16.0.0/12"      # 172.16-31.x.x 私有網段
  #   - "192.168.1.0/24"     # 特定子網路
  source_addresses:
    - "10.0.0.0/8"

# -----------------------------------------------------------------------------
# 時區設定 — 影響所有時間戳記的顯示格式
# -----------------------------------------------------------------------------
# 使用 IANA 時區名稱
# 範例: "Asia/Taipei", "Asia/Tokyo", "America/New_York", "Europe/London", "UTC"
# 預設值: "Asia/Taipei" (UTC+8)
timezone: "Asia/Taipei"
