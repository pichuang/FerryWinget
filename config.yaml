# =============================================================================
# FerryWinget 設定檔
# Server 和 Downloader 共用此設定檔
# YAML 命名慣例: underscore_case (由 YamlDotNet UnderscoredNamingConvention 處理)
#
# 敏感設定 (如 github_token) 請放在 config.local.yaml，該檔案不納入版控
# config.local.yaml 中的設定會自動覆蓋此檔案中的對應欄位
# =============================================================================

# -----------------------------------------------------------------------------
# 來源設定 — 指定從哪個 GitHub repo 取得 winget manifests
# -----------------------------------------------------------------------------
source:
  # GitHub 上的 winget-pkgs 來源 repo (格式: "owner/repo")
  # 預設值: "microsoft/winget-pkgs"
  github_repo: "microsoft/winget-pkgs"

  # GitHub Personal Access Token (用於提高 API rate limit)
  # 留空則使用匿名存取 (rate limit: 60 req/hr)，設定 token 後可提高至 5000 req/hr
  # 建議使用 fine-grained token，僅授予 Contents: read 權限
  # 可透過 `gh auth token` 取得目前已認證的 token
  github_token: ""

  # 要讀取 manifests 的分支名稱
  # 可用值: 任何有效的 git branch name
  # 注意: microsoft/winget-pkgs 的預設分支為 "master" (非 "main")
  # 預設值: "master"
  manifests_branch: "master"

# -----------------------------------------------------------------------------
# 儲存設定 — 本地檔案系統路徑
# -----------------------------------------------------------------------------
storage:
  # Mirror 資料根目錄 (相對路徑或絕對路徑皆可)
  # 預設值: "./mirror-data"
  root_path: "./mirror-data"

  # 套件存放子目錄 (相對於 root_path)
  # 結構: {packages_dir}/{PackageId}/{Version}/ 下放 manifest YAML + installer 二進位
  # 預設值: "packages"
  packages_dir: "packages"

  # 下載報告存放子目錄 (相對於 root_path)
  # 預設值: "reports"
  reports_dir: "reports"

# -----------------------------------------------------------------------------
# 篩選設定 — 控制要 mirror 哪些套件
# 使用 glob pattern 語法，支援 * (任意字元) 和 ? (單一字元)，大小寫不敏感
# 規則: blocklist 優先權最高，即使套件符合 allowlist 也會被排除
# -----------------------------------------------------------------------------
filtering:
  # 允許清單 — 只同步符合條件的套件
  # publishers 和 packages 為聯集關係 (OR)：符合任一條件即允許同步
  allowlist:
    # 是否啟用允許清單功能（啟用後僅同步清單內的套件）
    enabled: true

    # 依發行者名稱過濾（匹配 PackageIdentifier 的 Publisher 前綴）
    publishers:
      - "Microsoft"
      - "GitHub"

    # 依套件識別碼過濾（支援萬用字元）
    packages:
      - "Microsoft.*"
      - "GitHub.*"
      - "WiresharkFoundation.*"
      - "Telerik.Fiddler.Classic"

  # 封鎖清單 — 永遠排除符合這些 pattern 的套件 (優先權高於 allowlist)
  blocklist:
    # 是否啟用封鎖清單功能
    enabled: true

    # 依發行者名稱封鎖（匹配 PackageIdentifier 的 Publisher 前綴）
    publishers: []

    # 依套件識別碼封鎖（支援萬用字元）
    packages:
      # Visual Studio Community 版本
      - "Microsoft.VisualStudio.*.Community"
      - "Microsoft.VisualStudio.Community"

      # Beta / Preview / Insider / Canary / Dev 版本
      - "Microsoft.*.Beta"
      - "Microsoft.*.Preview"
      - "Microsoft.*.Insider"
      - "Microsoft.*.Insiders"
      - "Microsoft.*.Canary"
      - "Microsoft.*.Dev"
      - "GitHub.*.Beta"

      # 模擬器
      - "Microsoft.*.Emulator"
      - "Microsoft.*.Emulator.*"
      - "Microsoft.SurfaceDuoEmulator.Android11"

      # 已停止維護 / 已歸檔的 GitHub 專案
      - "GitHub.Atom"
      - "GitHub.ClassroomAssistant"
      - "GitHub.hub"
      - "GitHub.smimesign"

      # .NET Core / .NET 已 EOL 版本 (僅保留 8, 9, 10)
